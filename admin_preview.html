<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>견적 접수 관리</title><link rel="stylesheet" href="static/style.css"></head>
<body><main class="wrap adminWrap">
<section class="hero"><div class="eyebrow">ADMIN</div><h1>견적 접수 관리</h1><p>고객정보 · 현장 영상·사진 · 자동견적 결과를 한 화면에서 확인합니다.</p></section>
<section class="card adminCard"><div class="adminTableWrap"><table class="adminTable"><thead><tr><th>접수</th><th>고객</th><th>공사</th><th>현장</th><th>견적</th><th>영상</th><th>사진</th></tr></thead><tbody>


<tr>
<td data-label="접수"><b>#27</b><br><small>2026-09-09 20:42</small></td>
<td data-label="고객"><b>홍길동</b><br>010-1234-5678</td>
<td data-label="공사"><b>철거 + 원상복구</b><small class="scopeLabels" data-scopes='[&#34;ceiling&#34;, &#34;paint&#34;, &#34;electrical&#34;]'></small></td>
<td data-label="현장">82.0평 / 7층<br><small>엘리베이터 있음</small></td>
<td data-label="견적"><b>19,800,000 ~ 22,000,000원</b><br><small>신뢰도 medium</small></td>
<td data-label="영상"><a class="adminVideoBtn" href="/admin/video/27" target="_blank" rel="noopener">영상 보기</a></td>
<td data-label="사진"><a class="adminVideoBtn" href="/admin/photo/27/0" target="_blank" rel="noopener">사진 보기</a><br><small class="photoCount" data-json='[&#34;/tmp/a.jpg&#34;, &#34;/tmp/b.jpg&#34;]'></small></td>
</tr>
<tr class="adminBreakdownRow"><td colspan="7"><details class="adminBreakdown"><summary>항목별 산출 내역</summary><div class="breakdownInner" data-breakdown='[{&#34;name&#34;: &#34;내부 철거공사&#34;, &#34;qty&#34;: &#34;82.0평&#34;, &#34;low&#34;: 2100000, &#34;high&#34;: 2400000, &#34;note&#34;: &#34;현장 영상·사진 분석 기준&#34;}, {&#34;name&#34;: &#34;천장 원상복구&#34;, &#34;qty&#34;: &#34;10.0평&#34;, &#34;low&#34;: 1200000, &#34;high&#34;: 1700000, &#34;note&#34;: &#34;마이텍스·T-BAR 및 부분보수 확인&#34;}, {&#34;name&#34;: &#34;페인트·도장&#34;, &#34;qty&#34;: &#34;벽·기둥&#34;, &#34;low&#34;: 1500000, &#34;high&#34;: 1800000, &#34;note&#34;: &#34;백색 수성페인트 기준&#34;}, {&#34;name&#34;: &#34;전기·조명&#34;, &#34;qty&#34;: &#34;LED 약 40개&#34;, &#34;low&#34;: 1900000, &#34;high&#34;: 2200000, &#34;note&#34;: &#34;회로변경 포함 여부 확인&#34;}]'></div></details></td></tr>

</tbody></table></div></section></main>
<script>
const scopeLabels={ceiling:'천장',floor:'바닥',wall_partition:'벽체·칸막이',paint:'페인트·도장',electrical:'전기·조명',fire:'소방',hvac:'냉난방·에어컨',duct:'환기·덕트',plumbing:'설비',door_glass_sash:'출입문·유리·샷시',sign_exterior:'간판·외부마감',waxing:'왁싱',cleaning:'준공청소',other:'기타 원상복구'};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number.isFinite(Number(v))?Number(v).toLocaleString('ko-KR')+'원':'-';
document.querySelectorAll('.photoCount').forEach(el=>{try{const n=JSON.parse(el.dataset.json).length;el.textContent=`사진 ${n}장`;}catch(e){el.textContent='사진';}});
document.querySelectorAll('.scopeLabels').forEach(el=>{try{const a=JSON.parse(el.dataset.scopes);el.textContent=a.map(x=>scopeLabels[x]||x).join(', ');}catch(e){el.textContent='확인 필요';}});
document.querySelectorAll('[data-breakdown]').forEach(el=>{try{
 const rows=JSON.parse(el.dataset.breakdown||'[]');
 if(!Array.isArray(rows)||!rows.length){el.innerHTML='<p class="mutedText">산출 내역이 없습니다.</p>';return;}
 el.innerHTML='<table class="breakdownTable"><thead><tr><th>항목명</th><th>수량</th><th>금액</th><th>비고</th></tr></thead><tbody>'+rows.map(r=>`<tr><td><b>${esc(r.name||'-')}</b></td><td>${esc(r.qty??'-')}</td><td class="money">${money(r.low)} ~ ${money(r.high)}</td><td>${esc(r.note||'-')}</td></tr>`).join('')+'</tbody></table>';
}catch(e){el.innerHTML='<p class="mutedText">산출 내역을 불러오지 못했습니다.</p>';}});
</script></body></html>
